<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umochi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a id="logo">
            <img src="logo.svg" alt="umochi logo" width="24">
            <span>umochi</span>
        </a>
        <nav>
            <ul id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">Menu</a></li>
                <li><a href="contact.html">About</a></li>
            </ul>
        </nav>
        <a id="cart">
            <span>Basket(0)</span>
            <img src="basket.svg" alt="shopping basket" width="36">
        </a>
    </header>

    <section id="offers-scroller">
        <div class="slide"></div>
        <div class="slide"></div>
        <div class="slide" id="active-slide"></div>
        <div class="slide"></div>
        <div class="slide"></div>
    </section>

    <section id="popular-products">
        <span class="section-title">
            <h1>Popular</h1>
            <img src="hot.svg" alt="umochi logo" width="36">
        </span>
        <div class="bento-grid">
            <div class="card card-large">
                <h2>Sushi & Rolls</h2>
                <div class="circle-icon"></div>
            </div>

            <div class="card card-top-right">
                <h2>Starters</h2>
                <div class="circle-icon"></div>
            </div>

            <div class="card card-bottom-left">
                <h2>Drinks</h2>
                <div class="circle-icon"></div>
            </div>

            <div class="card card-bottom-mid">
                <h2>Desserts</h2>
                <div class="circle-icon"></div>
            </div>

            <div class="card card-tall-right">
                <h2>Ramen & Wok</h2>
                <div class="circle-icon"></div>
            </div>
        </div>

        <div class="set-builder-banner">
            <div class="banner-content">
                <h3>Build Your Own Set</h3>
                <p>Pick your favorite rolls, nigiri, and sides to create a custom box.</p>
            </div>
            <button class="builder-btn">Start Building</button>
        </div>
    </section>

    <section id="about-us">
        <span class="section-title">
            <h1>Reviews</h1>
        </span>
        <section id="reviews">
            <div class="review"></div>
            <div class="review"></div>
            <div class="review"></div>
        </section>
        <div id="about-us-card"></div>
    </section>

    <footer>
        <span id="footer-logo">umochi</span>
    </footer>
</body>
</html>
